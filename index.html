<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <title>World Right Now – Daily video feed</title>
  <style>
    :root{color-scheme:dark}
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;font-family:Arial,Helvetica,sans-serif;background:#080808;color:#fff}
    body{padding:12px}
    .head{display:flex;justify-content:space-between;gap:10px;align-items:center;margin-bottom:12px;font-size:11px;letter-spacing:.12em}
    .time{font-size:10px;color:#aaa;letter-spacing:0}
    .grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
    .tile{min-width:0}
    .video{background:#141414;aspect-ratio:9/16;position:relative;overflow:hidden;width:100%}
    .video iframe,.video .yt-holder{position:absolute;inset:0;display:block;border:0;width:100%;height:100%}
    .empty{display:flex;position:absolute;inset:0;align-items:center;justify-content:center;text-align:center;color:#888;font-size:11px;padding:12px}
    .meta{display:flex;justify-content:space-between;gap:12px;margin-top:8px;font-size:11px}
    .name{font-weight:700;letter-spacing:.05em}
    .source{font-size:9px;color:#aaa;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .title{display:block;margin-top:5px;font-size:10px;color:#aaa;text-decoration:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .foot{color:#999;font-size:9px;margin-top:14px}
    html.single,body.single{background:transparent;height:100%;min-height:0;overflow:hidden}
    body.single{padding:0}
    body.single .head,body.single .foot{display:none}
    body.single .grid,body.single .tile,body.single .video{width:100%;height:100%;display:block;aspect-ratio:auto;margin:0}
    body.single .meta,body.single .title{display:none}
    @media(max-width:700px){.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}}
  </style>
</head>
<body>
  <header class="head"><strong>THE WORLD RIGHT NOW</strong><span class="time" id="updated">DAILY VIDEO SELECTION</span></header>
  <main id="grid" class="grid"></main>
  <p class="foot">Videos are embedded from YouTube. An embed may still be restricted by YouTube, even when its metadata says it is embeddable. Vertical layout does not guarantee vertical original footage.</p>
<script>
'use strict';
const TOPICS = {
  war: 'WAR', animals: 'ANIMAL SUFFERING', protests: 'PROTESTS',
  climate: 'CLIMATE', migration: 'MIGRATION', wealth: 'WEALTH & POWER'
};
const chosen = new URLSearchParams(location.search).get('topic');
const single = Object.prototype.hasOwnProperty.call(TOPICS,chosen);
if(single){document.documentElement.classList.add('single');document.body.classList.add('single');}
const grid = document.getElementById('grid');
const cells = [];
let apiReady = false;
let apiLoaded = false;

function el(tag, cls, text){
  const e=document.createElement(tag);
  if(cls)e.className=cls;
  if(text)e.textContent=text;
  return e;
}
function good(v){ return v && typeof v.id==='string' && /^[A-Za-z0-9_-]{11}$/.test(v.id); }
function uniqueVideos(primary, backups){
  const seen = new Set();
  return [primary,...(Array.isArray(backups)?backups:[])].filter(v=>{
    if(!good(v)||seen.has(v.id))return false;
    seen.add(v.id);return true;
  });
}
function statusMessage(cell, message){
  cell.holder.replaceChildren(el('div','empty',message));
}
function initPlayer(cell){
  if(!apiReady || cell.player || !cell.items.length)return;
  showCurrent(cell);
}
function showCurrent(cell){
  if(cell.index >= cell.items.length){
    statusMessage(cell,'VIDEO UNAVAILABLE');
    if(cell.link)cell.link.removeAttribute('href');
    return;
  }
  const v=cell.items[cell.index];
  cell.holder.replaceChildren();
  const target=el('div','yt-holder');
  cell.holder.appendChild(target);
  cell.link && (cell.link.href='https://www.youtube.com/watch?v='+encodeURIComponent(v.id));
  if(cell.link)cell.link.textContent=v.title||'Original source';
  if(cell.source)cell.source.textContent=v.channel||'';
  try{
    cell.player=new YT.Player(target,{
      videoId:v.id,
      host:'https://www.youtube-nocookie.com',
      width:'100%', height:'100%',
      playerVars:{
        autoplay:1, mute:1, controls:0, disablekb:1,
        playsinline:1, fs:0, rel:0,
        loop:1, playlist:v.id, origin:location.origin
      },
      events:{
        onReady:function(e){
          // Muted playback is more likely to be allowed by browsers.
          try{e.target.mute();e.target.playVideo();}catch(_error){}
        },
        onStateChange:function(e){
          if(e.data===YT.PlayerState.ENDED){
            try{e.target.seekTo(0,true);e.target.playVideo();}catch(_error){}
          }
        },
        onError:function(e){
          console.warn('YouTube error in '+cell.key+': '+e.data+'; trying a backup');
          try{cell.player&&cell.player.destroy();}catch(_error){}
          cell.player=null;
          cell.index+=1;
          setTimeout(()=>showCurrent(cell),150);
        }
      }
    });
  }catch(error){
    console.warn('Could not initialize YouTube player:',error);
    cell.player=null;cell.index++;
    setTimeout(()=>showCurrent(cell),150);
  }
}

function draw(data){
  grid.replaceChildren();
  cells.length=0;
  const keys=single?[chosen]:Object.keys(TOPICS);
  for(const key of keys){
    const tile=el('article','tile');
    const video=el('div','video');
    const holder=el('div','yt-holder');
    video.appendChild(holder);
    tile.appendChild(video);
    const meta=el('div','meta');
    meta.appendChild(el('strong','name',TOPICS[key]));
    const source=el('span','source','');meta.appendChild(source);
    const link=el('a','title','');
    link.target='_blank';link.rel='noopener noreferrer';
    tile.appendChild(meta);tile.appendChild(link);
    grid.appendChild(tile);
    const items=uniqueVideos(data.videos?.[key],data.alternatives?.[key]);
    const cell={key,items,index:0,holder,source,link,player:null};
    cells.push(cell);
    if(items.length) initPlayer(cell);
    else statusMessage(cell,'NO CLIP AVAILABLE');
  }
  if(data.updatedAt){
    const d=new Date(data.updatedAt);
    document.getElementById('updated').textContent='UPDATED '+(isNaN(d.getTime())?'RECENTLY':d.toLocaleDateString('en-GB'));
  }
}
window.onYouTubeIframeAPIReady=function(){
  apiReady=true;
  cells.forEach(initPlayer);
};
function loadYouTubeAPI(){
  if(apiLoaded)return;
  apiLoaded=true;
  const script=document.createElement('script');
  script.src='https://www.youtube.com/iframe_api';
  script.async=true;
  script.onerror=()=>{
    console.warn('YouTube player script was blocked');
    cells.forEach(cell=>statusMessage(cell,'VIDEO UNAVAILABLE'));
  };
  document.head.appendChild(script);
}
fetch('./videos.json?ts='+Date.now(),{cache:'no-store'})
  .then(r=>{if(!r.ok)throw new Error('videos.json HTTP '+r.status);return r.json();})
  .then(data=>{draw(data);loadYouTubeAPI();})
  .catch(error=>{
    console.error(error);
    grid.replaceChildren(el('div','empty','VIDEO FEED UNAVAILABLE'));
  });
</script>
</body>
</html>
